# vllm-keepalive-shim.service hardening drop-in — proposed by the shim-hardening lane review
# (see LANE/unit-review.md for the evidence). NOT installed by this lane. Install as
# /etc/systemd/system/vllm-keepalive-shim.service.d/hardening.conf, then
# `sudo systemctl daemon-reload && sudo systemctl restart vllm-keepalive-shim.service`.
[Unit]
# Same bug vllm-qwen27b.service.d/no-start-limit.conf already fixed for the engine: without
# this, 5 crashes in 10s latches the unit to `failed` and /health stops answering until
# someone runs `systemctl reset-failed` by hand. This is the front door -- it must keep
# retrying, not give up. RestartSec=3 already bounds the retry rate.
StartLimitIntervalSec=0

[Service]
# Circuit breaker for whichever future feature introduces an unbounded-growth bug that code
# review misses (this lane just fixed two: _RESEARCH_CLAIMS_CACHE, preview/UA strings).
# Generous on purpose -- this must not fire under any observed normal load, only a real leak.
MemoryMax=768M
# Lighter than the engine's -800 (which protects an irreplaceable 24GB VRAM-loaded process).
# This process restarts in ~1s, so a moderate bias is enough: it deprioritizes the shim vs. an
# ordinary desktop process WITHOUT making the kernel refuse to ever reclaim it under real
# pressure the way a very negative score effectively can.
OOMScoreAdjust=-200
# _on_cleanup is one cancel() + one synchronous small JSON write; it should never take
# anywhere near this, so bound it instead of inheriting the 90s systemd default -- a wedged
# shutdown should fail fast into Restart=on-failure, not stall every restart/deploy for 90s.
TimeoutStopSec=15
