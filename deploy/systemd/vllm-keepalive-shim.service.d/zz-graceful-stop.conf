[Service]
# Must exceed aiohttp's 1800-second graceful shutdown for accepted model calls.
# The guarded publisher drains admissions first; this is the independent stop
# path for a direct restart, crash recovery, or an unexpected unit operation.
TimeoutStopSec=1830
# A duplicate process must never retry in a tight loop against the same daily
# spend ledger. Exit 75 leaves the existing owner serving and this unit failed.
RestartPreventExitStatus=75
