[Unit]
# Restart=always is meaningless if StartLimitBurst latches the unit to failed after 5
# rapid failures -- systemctl start then silently no-ops and the engine stays down. For a
# service that must always be up, keep retrying (RestartSec=15 bounds the rate); persistent
# failure surfaces via the watchdog log and NRestarts rather than by giving up.
StartLimitIntervalSec=0
