[Service]
# 2026-09-04 hardening set TimeoutStopSec=180 on the belief that a healthy TP=2 teardown regularly
# exceeded 90 s. 2026-09-05 journal evidence says otherwise: every clean stop today took 5-8 s
# (00:10, 00:30, 00:56, 01:40, 06:48, 10:43, 15:34), and every stop that reached the timeout was a
# DEAD engine (wedge or Xid) whose workers never exit on SIGTERM -- the 180 s only delayed recovery
# (18:48:14 EngineCore death -> 18:51:15 SIGKILL -> restart). 30 s is ~4x the observed healthy
# teardown and turns a dead-engine restart from ~3.5 min into ~40 s.
TimeoutStopSec=30
