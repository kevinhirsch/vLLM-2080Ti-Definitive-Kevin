[Service]
# CUDA crashes (Xid 31 EngineDead) make the engine exit code 0 -> Restart=on-failure ignored it
# and the watchdog no-ops when :8001 is fully down => local stayed down until a human noticed
# (2026-08-13). Restart=always guarantees resurrection from ANY exit; 15s pacing prevents a
# tight crash-loop from thrashing (gateway serves via DeepSeek during every gap).
Restart=always
RestartSec=15
